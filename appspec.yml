version: 0.0
os: linux
files:
  - source: /
    destination: /opt/app
hooks:
  BeforeInstall:
    - location: deploy/validate.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: deploy/deploy.sh
      timeout: 120
      runas: root
  ValidateService:
    - location: deploy/validate.sh
      timeout: 60
      runas: root
