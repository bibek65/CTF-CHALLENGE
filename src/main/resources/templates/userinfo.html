<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>User Info</title>
</head>
<body>
    <h2>User Information</h2>
    <table>
        <tr><th>Field</th><th>Value</th></tr>
        <tr>
            <td>Username</td>
            <td th:text="${user.username}">-</td>
        </tr>
        <tr>
            <td>Email</td>
            <td th:text="${user.email}">-</td>
        </tr>
    </table>
</body>
</html>
